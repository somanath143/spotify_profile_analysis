services:
  - type: web
    name: spotify-profile
    runtime: node
    plan: free
    buildCommand: yarn && cd client && yarn && NODE_OPTIONS=--openssl-legacy-provider yarn build
    startCommand: yarn start
    envVars:
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: FRONTEND_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --openssl-legacy-provider
