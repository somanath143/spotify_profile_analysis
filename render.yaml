services:
  - type: web
    name: spotify-profile
    runtime: node
    plan: free
    buildCommand: yarn && cd client && yarn && yarn build
    startCommand: yarn start
    envVars:
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: FRONTEND_URI
        sync: false
      - key: NODE_ENV
        value: production
